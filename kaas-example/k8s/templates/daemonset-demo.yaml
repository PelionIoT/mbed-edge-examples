# DaemonSet demo, pinned to a single device
#
# A DaemonSet normally runs one pod on EVERY node in the cluster. For a demo
# that is rarely what you want, so this one is restricted to a single device
# with a nodeSelector.
#
# Every Izuma edge node is automatically labelled with its device ID:
#
#   $ kubectl get nodes --show-labels
#   NAME       ... LABELS
#   01a002...  ... beta.kubernetes.io/arch=amd64,beta.kubernetes.io/os=linux,
#                  kubernetes.io/hostname=01a002...
#
# so selecting on kubernetes.io/hostname targets exactly one node, with no
# manual labelling. To roll it out to the whole fleet instead, remove the
# nodeSelector block (or set it to {}).
#
# The pod reports which node it landed on, so you can confirm placement.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: daemonset-demo-${NODE_NAME}
  labels:
    app: daemonset-demo
    device: ${NODE_NAME}
  annotations:
    kubectl.kubernetes.io/change-cause: "DaemonSet demo v1.0"
spec:
  selector:
    matchLabels:
      app: daemonset-demo
      # The device label must be part of the selector. Two DaemonSets whose
      # selectors both matched app=daemonset-demo would each try to adopt the
      # other's pods and fight over them.
      device: ${NODE_NAME}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1  # update one node at a time
  template:
    metadata:
      labels:
        app: daemonset-demo
        device: ${NODE_NAME}
    spec:
      automountServiceAccountToken: false
      # This is the line that limits the DaemonSet to one device.
      nodeSelector:
        kubernetes.io/hostname: ${NODE_NAME}
        # Alternative: target every node of one architecture instead
        # beta.kubernetes.io/arch: amd64
      tolerations:
      # Allows scheduling onto tainted nodes. Optional, but it is what the
      # other Izuma DaemonSet examples use.
      - effect: NoSchedule
        operator: Exists
      containers:
      - name: web
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        env:
        # Downward API. Deliberately NOT called NODE_NAME: render.sh runs
        # envsubst over $NODE_NAME, so that name would be replaced at render
        # time and this would no longer demonstrate a runtime lookup.
        - name: K8S_NODE
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_POD
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        command:
        - sh
        - -c
        - |
          set -eu
          {
            echo "<h1>DaemonSet demo</h1>"
            echo "<p>pod: $K8S_POD</p>"
            echo "<p>node: $K8S_NODE</p>"
            echo "<p>started: $(date -u +%Y-%m-%dT%H:%M:%SZ)</p>"
          } > /usr/share/nginx/html/index.html
          exec nginx -g 'daemon off;'
        ports:
        - containerPort: 80
          # 3000, 8084 and 31080 are used by the other example pods.
          hostPort: 31081
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
